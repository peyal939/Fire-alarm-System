components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device:
          type: integer
        device_hardware_identifier:
          type: string
          readOnly: true
        alert_type:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/AlertStatusEnum'
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        last_triggered_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_by:
          type: integer
          readOnly: true
          nullable: true
        acknowledged_by_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        last_reminder_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reminder_count:
          type: integer
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        owner_phone:
          type: string
          readOnly: true
      required:
      - alert_type
      - device
      - device_hardware_identifier
      - id
  - last_triggered_at
      - owner_email
      - owner_id
      - owner_phone
  - reminder_count
      - resolved_at
      - triggered_at
    AlertStatusEnum:
      enum:
      - open
      - resolved
      type: string
      description: |-
        * `open` - Open
        * `resolved` - Resolved
    CancelViewResponse:
      type: object
      properties:
        message:
          type: string
        order_id:
          type: string
          nullable: true
      required:
      - message
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hardware_identifier:
          type: string
          maxLength: 64
        device_name:
          type: string
          maxLength: 255
        device_role:
          type: string
          readOnly: true
        master_id:
          type: integer
          readOnly: true
        master_hardware_identifier:
          type: string
          readOnly: true
        master_device_name:
          type: string
          readOnly: true
        master_last_seen:
          type: string
          format: date-time
          readOnly: true
        mesh_alert:
          type: boolean
          description: |-
            True if any device in this device's mesh has an open smoke_high alert.

            Mesh is defined as: the master + all its slaves. For masters, master=self; for slaves, master=obj.master.
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        phone_number:
          type: string
          readOnly: true
          nullable: true
        phone_number_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          type: string
          maxLength: 32
        effective_status:
          type: string
          description: |-
            Return a derived status string prioritizing offline if stale.

            Keeps the raw device-provided `status` field intact while ensuring UIs
            can display an authoritative offline state when last_seen expired.
          readOnly: true
        registered_at:
          type: string
          format: date-time
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        online:
          type: boolean
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        owner_phone:
          type: string
          readOnly: true
      required:
      - device_role
      - effective_status
      - hardware_identifier
      - id
      - last_seen
      - master_device_name
      - master_hardware_identifier
      - master_id
      - master_last_seen
      - mesh_alert
      - online
      - owner_email
      - owner_id
      - owner_phone
      - phone_number
      - phone_number_updated_at
      - registered_at
    DevicePhoneUpdate:
      type: object
      properties:
        phone_number:
          type: string
          maxLength: 20
      required:
      - phone_number
    DeviceRegister:
      type: object
      properties:
        hardware_identifier:
          type: string
          description: Unique hardware identifier of the device
          maxLength: 64
        device_name:
          type: string
          description: Optional name
          maxLength: 255
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          description: Latitude in decimal degrees (-90..90)
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          description: Longitude in decimal degrees (-180..180)
        device_role:
          allOf:
          - $ref: '#/components/schemas/DeviceRoleEnum'
          default: master
          description: |-
            Role of the device: master (default) or slave

            * `master` - Master
            * `slave` - Slave
        master_id:
          type: integer
          nullable: true
          description: Required when device_role=slave. Must reference an existing
            master device (ID) that belongs to you (unless superadmin).
      required:
      - hardware_identifier
      - latitude
      - longitude
    DeviceRoleEnum:
      enum:
      - master
      - slave
      type: string
      description: |-
        * `master` - Master
        * `slave` - Slave
    DeviceSummary:
      type: object

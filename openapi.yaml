      - owner_email
      - owner_id
      - owner_phone
      - received_at
      - smoke_level
      - timestamp
    TestNotification:
      type: object
      description: Serializer for sending test notifications.
      properties:
        message:
          type: string
          default: Test notification from Fire Alarm System
          maxLength: 500
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    User:
      type: object
      description: Base serializer (kept for backwards compatibility in auth responses).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        address:
          type: string
      required:
      - email
      - id
      - role
    UserDetail:
      type: object
      description: Base serializer (kept for backwards compatibility in auth responses).
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        phone_number:
          type: string
          maxLength: 32
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        full_name:
          type: string
          maxLength: 255
        address:
          type: string
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceSummary'
          readOnly: true
      required:
      - devices
      - email
      - id
      - role
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

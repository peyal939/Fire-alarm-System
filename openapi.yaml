  /devices/composite/:
    get:
      operationId: devices_composite_retrieve
      description: |-
        Return a composite payload for a master and its slaves using keys compatible with the IoT format.

        - If the 'master' query parameter (hardware identifier) is provided, returns a single composite object.
        - If omitted, returns a list of composite objects for all masters in the caller's scope.

        Fields:
        - masterDeviceID: string (hardware identifier of master)
        - timestamp: epoch seconds derived from last_seen (or null)
        - smoke: last known smoke level (latest telemetry within freshness window, else 0)
        - status: device.status (defaults to 'alive' if empty)
        - slaves: array of { deviceID, timestamp, smoke, status } for each registered slave under the master.
      summary: Composite snapshot (master + slaves)
      parameters:
      - in: query
        name: master
        schema:
          type: string
        description: Master hardware identifier. If omitted, returns all masters
      tags:
      - Devices
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /devices/register/:
    post:
      operationId: devices_register_create
      description: |
        Register a device as either a master (default) or a slave.

        How to register a slave device:
        - Set `device_role` to `slave`.
        - Provide `master_id` referencing an existing master device that you own (non-admin users). Admins/staff/superadmins can attach a slave to any master regardless of owner.
        - The selected master must have role `master`; you cannot attach to another slave.

        Additional rules:
        - `master_id` is required when `device_role` is `slave`, and must NOT be provided when `device_role` is `master`.
        - Latitude and longitude are required on first registration.
        - If the hardware identifier is already registered by another user, the endpoint returns 409 Conflict.
        - If the device is already registered by you (or you are superadmin), the same call updates name/coordinates and returns 200.
      summary: Register/claim a device
      tags:
      - Devices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegister'
            examples:
              RegisterMasterRequest:
                value:
                  hardware_identifier: MASTER-001
                  device_name: Main Panel
                  latitude: 23.777628
                  longitude: 90.405449
                  device_role: master
              RegisterSlaveRequest:
                value:
                  hardware_identifier: SLAVE-101
                  device_name: Floor 1 Sensor
                  latitude: 23.7777
                  longitude: 90.4055
                  device_role: slave
                  master_id: 123
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DeviceRegister'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DeviceRegister'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
              examples:
                DeviceAlreadyRegistered:
                  value:
                    detail: Device already registered by another user
          description: Conflict when attempting to register a device owned by another
            user.

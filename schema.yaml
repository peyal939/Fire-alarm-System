components:
  schemas:
    AccountDeviceSummary:
      type: object
      description: Minimal device representation for embedding inside user detail.
      properties:
        id:
          type: integer
          readOnly: true
        hardware_identifier:
          type: string
          readOnly: true
        device_name:
          type: string
          readOnly: true
        device_role:
          allOf:
          - $ref: '#/components/schemas/DeviceRoleEnum'
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
          nullable: true
        status:
          type: string
          readOnly: true
        last_seen:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - device_name
      - device_role
      - hardware_identifier
      - id
      - last_seen
      - latitude
      - longitude
      - status
    AdminDeviceSubscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device:
          allOf:
          - $ref: '#/components/schemas/SubscriptionDeviceSummary'
          readOnly: true
        status:
          $ref: '#/components/schemas/DeviceSubscriptionStatusEnum'
        monthly_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        billing_anchor:
          type: string
          format: date-time
        last_paid_through:
          type: string
          format: date-time
        next_due_at:
          type: string
          format: date-time
        grace_expires_at:
          type: string
          format: date-time
          nullable: true
        admin_override_until:
          type: string
          format: date-time
          nullable: true
        days_remaining:
          type: integer
          readOnly: true
        is_accessible:
          type: boolean
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
      required:
      - billing_anchor
      - days_remaining
      - device
      - id
      - is_accessible
      - last_paid_through
      - next_due_at
      - owner_email
      - owner_id
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        device:
          type: integer
        device_hardware_identifier:
          type: string
          readOnly: true
        alert_type:
          type: string
          maxLength: 64
        status:
          $ref: '#/components/schemas/AlertStatusEnum'
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        last_triggered_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_by:
          type: integer
          readOnly: true
        acknowledged_by_email:
          type: string
          format: email
          readOnly: true
        last_reminder_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        reminder_count:
          type: integer
          readOnly: true
        owner_id:
          type: integer
          readOnly: true
        owner_email:
          type: string
          format: email
          readOnly: true
        owner_phone:
          type: string
          readOnly: true
      required:
      - acknowledged_at
      - acknowledged_by
      - acknowledged_by_email
      - alert_type
      - device
      - device_hardware_identifier
      - id
      - last_reminder_at
      - last_triggered_at
      - owner_email
      - owner_id
      - owner_phone
      - reminder_count
      - resolved_at
      - triggered_at
    AlertStatusEnum:
      enum:
      - open
      - resolved
      type: string
      description: |-
        * `open` - Open
        * `resolved` - Resolved
    CancelViewResponse:
      type: object
      properties:
        message:
          type: string
        order_id:
          type: string
          nullable: true
      required:
      - message
    ChangePassword:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
        new_password:
          type: string
          writeOnly: true
          minLength: 6
        confirm_new_password:
          type: string
          writeOnly: true
      required:
      - confirm_new_password
      - current_password
      - new_password
    Device:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hardware_identifier:
          type: string
          maxLength: 64
        device_name:
          type: string
          maxLength: 255
        device_role:
          type: string
          readOnly: true
        master_id:
          type: integer
          readOnly: true
        master_hardware_identifier:
          type: string
          readOnly: true
        master_device_name:
          type: string
          readOnly: true
        master_last_seen:
          type: string
          format: date-time
          readOnly: true
        mesh_alert:
          type: boolean
          description: |-
            True if any device in this device's mesh has an open smoke_high alert.

            Mesh is defined as: the master + all its slaves. For masters, master=self; for slaves, master=obj.master.
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        phone_number:
          type: string
          readOnly: true
          nullable: true
        phone_number_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          type: string
          maxLength: 32
        effective_status:
          type: string
          description: |-
            Return a derived status string prioritizing offline if stale.

            Keeps the raw device-provided `status` field intact while ensuring UIs

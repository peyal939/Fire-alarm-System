    post:
      operationId: orders_payment_notify_create
      description: |-
        Webhook to receive the provider (SurjoPay) order id after successful payment.

        Expected JSON:
          {
            "order_id": "provider-generated-id-or-our-integer-id",
            "transaction_id": "tx_abc123",         # optional
            "gateway_response": {...}              # optional
          }

        This sends the `payment_received` signal. A receiver will mark the order
        as paid if it is currently pending.
      summary: Payment notification webhook - receive provider order id to mark pending
        order paid
      tags:
      - Orders
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                order_id:
                  type: string
                transaction_id:
                  type: string
                gateway_response:
                  type: object
              required:
              - order_id
      responses:
        '200':
          description: No response body
        '400':
          description: No response body

openapi: 3.0.3
info:
  title: APS Fire Alarm API
  version: 1.0.0
  description: API schema for authentication, devices, telemetry, and alerts.
paths:
  /alerts/:
    get:
      operationId: alerts_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - Alerts
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
  /alerts/{id}/:
    get:
      operationId: alerts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alert.
        required: true
      tags:
      - Alerts
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /alerts/{id}/acknowledge/:
    post:
      operationId: alerts_acknowledge_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alert.
        required: true
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Alert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Alert'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /alerts/{id}/resolve/:
    post:
      operationId: alerts_resolve_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this alert.
        required: true
      tags:
      - Alerts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Alert'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Alert'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Alert'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /api/fcm/devices/:
    get:
      operationId: api_fcm_devices_list
      description: Get all FCM devices registered for the current user
      summary: List registered devices
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFCMDeviceList'
          description: ''
    post:
      operationId: api_fcm_devices_create
      description: Register a new FCM device token for push notifications. If the
        token already exists, it will be updated with the current user.
      summary: Register FCM device token
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FCMDevice'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FCMDevice'
          description: ''
  /api/fcm/devices/{id}/:
    get:
      operationId: api_fcm_devices_retrieve
      description: |-
        ViewSet for managing FCM device tokens.

        Endpoints:
        - POST /api/fcm/devices/ - Register new FCM token
        - GET /api/fcm/devices/ - List user's registered devices
        - DELETE /api/fcm/devices/{id}/ - Unregister a device
        - POST /api/fcm/devices/test/ - Send test notification
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FCMDevice'
          description: ''
    put:
      operationId: api_fcm_devices_update
      description: |-
        ViewSet for managing FCM device tokens.

        Endpoints:
        - POST /api/fcm/devices/ - Register new FCM token
        - GET /api/fcm/devices/ - List user's registered devices
        - DELETE /api/fcm/devices/{id}/ - Unregister a device
        - POST /api/fcm/devices/test/ - Send test notification
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FCMDevice'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FCMDevice'
          description: ''
    patch:
      operationId: api_fcm_devices_partial_update
      description: |-
        ViewSet for managing FCM device tokens.

        Endpoints:
        - POST /api/fcm/devices/ - Register new FCM token
        - GET /api/fcm/devices/ - List user's registered devices
        - DELETE /api/fcm/devices/{id}/ - Unregister a device
        - POST /api/fcm/devices/test/ - Send test notification
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFCMDevice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFCMDevice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFCMDevice'
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FCMDevice'
          description: ''
    delete:
      operationId: api_fcm_devices_destroy
      description: Remove an FCM device token (stop receiving notifications)
      summary: Unregister device
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/fcm/devices/{id}/activate/:
    post:
      operationId: api_fcm_devices_activate_create
      description: Re-activate a previously deactivated device token
      summary: Activate device token
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FCMDevice'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FCMDevice'
          description: ''
  /api/fcm/devices/{id}/deactivate/:
    post:
      operationId: api_fcm_devices_deactivate_create
      description: Deactivate a device token without deleting it
      summary: Deactivate device token
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FCMDevice'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FCMDevice'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FCMDevice'
          description: ''
  /api/fcm/devices/test/:
    post:
      operationId: api_fcm_devices_test_create
      description: Send a test push notification to all registered devices
      summary: Send test notification
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestNotification'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TestNotification'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TestNotification'
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                description: Test notification sent
                examples:
                  application/json:
                    message: Test notification sent successfully
                    results:
                      success: 1
                      failure: 0
                      invalid_tokens: []
          description: ''
  /api/fcm/logs/:
    get:
      operationId: api_fcm_logs_list
      description: Get notification history for the current user
      summary: List notification history
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
        description: Filter by status (sent, failed, invalid_token)
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNotificationLogList'
          description: ''
  /api/fcm/logs/{id}/:
    get:
      operationId: api_fcm_logs_retrieve
      description: |-
        ViewSet for viewing notification history.

        Endpoints:
        - GET /api/fcm/logs/ - List notification history
        - GET /api/fcm/logs/{id}/ - Get specific notification details
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationLog'
          description: ''
  /auth/change-password:
    post:
      operationId: auth_change_password_create
      description: Allows an authenticated user to update their password by providing
        the current password along with a new password (entered twice for confirmation).
      summary: Change current user password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
            examples:
              ChangePasswordRequest:
                value:
                  current_password: Passw0rd!
                  new_password: N3wPassw0rd!
                  confirm_new_password: N3wPassw0rd!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
        '401':
          description: No response body
  /auth/login:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      summary: Login with email or phone plus password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
            examples:
              LoginRequestEmail:
                value:
                  email: user@example.com
                  password: Passw0rd!
              LoginRequestPhone:
                value:
                  phone_number: '+8801700000000'
                  password: Passw0rd!
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailTokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailTokenObtainPair'
              examples:
                LoginOTPChallenge:
                  value:
                    session_id: 7f9d19f8-2c4f-4d28-8bd6-1e7ee7d9f5d0
                    otp_sent_to: '********0000'
                    expires_in: 300
                    resend_cooldown: 60
          description: ''
  /auth/login/verify:
    post:
      operationId: auth_login_verify_create
      summary: Complete login with OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginOTPVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginOTPVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginOTPVerify'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
  /auth/me:
    get:
      operationId: auth_me_retrieve
      description: "Returns the authenticated user's full profile including owned\
        \ devices.\n\nPATCH allows partial updates of: full_name, phone_number, address.\
        \ \nRole and email cannot be changed via this endpoint."
      summary: Get or update current user profile
      tags:
      - Auth
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
              examples:
                GetProfileResponse:
                  value:
                    id: 7
                    email: user@example.com
                    phone_number: '+8801712345678'
                    role: user
                    full_name: Jane Operator
                    address: 123 Flame Ave, Dhaka
                    devices:
                    - id: 21
                      hardware_identifier: FD-ABC123
                      device_name: Kitchen Detector
                      device_role: master
                      latitude: 23.78001
                      longitude: 90.41002
                      status: normal
                      last_seen: '2025-10-05T06:30:00Z'
                PatchProfileResponse:
                  value:
                    id: 7
                    email: user@example.com
                    phone_number: '+8801999887766'
                    role: user
                    full_name: Jane Firewatch
                    address: 456 Smoke Rd, Dhaka
                    devices: []
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
    patch:
      operationId: auth_me_partial_update
      description: "Returns the authenticated user's full profile including owned\
        \ devices.\n\nPATCH allows partial updates of: full_name, phone_number, address.\
        \ \nRole and email cannot be changed via this endpoint."
      summary: Get or update current user profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
            examples:
              PatchProfileRequest:
                value:
                  full_name: Jane Firewatch
                  address: 456 Smoke Rd, Dhaka
                  phone_number: '+8801999887766'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserUpdate'
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
              examples:
                GetProfileResponse:
                  value:
                    id: 7
                    email: user@example.com
                    phone_number: '+8801712345678'
                    role: user
                    full_name: Jane Operator
                    address: 123 Flame Ave, Dhaka
                    devices:
                    - id: 21
                      hardware_identifier: FD-ABC123
                      device_name: Kitchen Detector
                      device_role: master
                      latitude: 23.78001
                      longitude: 90.41002
                      status: normal
                      last_seen: '2025-10-05T06:30:00Z'
                PatchProfileResponse:
                  value:
                    id: 7
                    email: user@example.com
                    phone_number: '+8801999887766'
                    role: user
                    full_name: Jane Firewatch
                    address: 456 Smoke Rd, Dhaka
                    devices: []
          description: ''
        '400':
          description: No response body
        '401':
          description: No response body
  /auth/password/forgot/complete:
    post:
      operationId: auth_password_forgot_complete_create
      summary: Complete forgot-password with OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetComplete'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetComplete'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetComplete'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
  /auth/password/forgot/init:
    post:
      operationId: auth_password_forgot_init_create
      summary: Start forgot-password flow (send OTP)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetInit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetInit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetInit'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
        '429':
          description: No response body
  /auth/refresh:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /auth/register:
    post:
      operationId: auth_register_create
      summary: Register a new user
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
            examples:
              RegisterRequest:
                value:
                  email: user@example.com
                  password: Passw0rd!
                  phone_number: '+8801712345678'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              examples:
                RegisterResponse:
                  value:
                    id: 1
                    email: user@example.com
                    phone_number: '+8801712345678'
                    role: user
          description: ''
        '409':
          description: No response body
        '400':
          description: No response body
  /auth/register/init:
    post:
      operationId: auth_register_init_create
      summary: Begin registration (send OTP)
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInit'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationInit'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationInit'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: No response body
        '400':
          description: No response body
        '409':
          description: No response body
        '429':
          description: No response body
  /auth/register/verify:
    post:
      operationId: auth_register_verify_create
      summary: Complete registration with OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationVerify'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistrationVerify'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistrationVerify'
        required: true
      security:
      - cookieAuth: []
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
  /auth/users/{id}:
    get:
      operationId: auth_users_retrieve
      description: |-
        Allows staff/superusers to retrieve or partially update a user.

        Updatable fields: full_name, phone_number, address, role.
        Email and privilege flags (is_staff/is_superuser) are not exposed here.
      summary: 'Admin: get or update user detail by ID'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
              examples:
                AdminGetUserResponse:
                  value:
                    id: 4
                    email: client@example.com
                    phone_number: '+8801700112233'
                    role: user
                    full_name: Client A
                    address: 10 Alarm Street
                    devices:
                    - id: 55
                      hardware_identifier: FD-XYZ987
                      device_name: Lobby Detector
                      device_role: master
                      latitude: 23.70001
                      longitude: 90.42002
                      status: normal
                      last_seen: '2025-10-05T05:57:10Z'
                AdminPatchUserResponse:
                  value:
                    id: 4
                    email: client@example.com
                    phone_number: '+8801700112233'
                    role: superadmin
                    full_name: Client Alpha
                    address: 10 Alarm Street
                    devices: []
          description: ''
        '400':
          description: No response body
        '403':
          description: No response body
        '404':
          description: No response body
    patch:
      operationId: auth_users_partial_update
      description: |-
        Allows staff/superusers to retrieve or partially update a user.

        Updatable fields: full_name, phone_number, address, role.
        Email and privilege flags (is_staff/is_superuser) are not exposed here.
      summary: 'Admin: get or update user detail by ID'
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
            examples:
              AdminPatchUserRequest:
                value:
                  full_name: Client Alpha
                  role: superadmin
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminUserUpdate'
      security:
      - cookieAuth: []
      - jwtAuth: []
      responses:
        '200':
          content:

{% extends "base.html" %}
{% block title %}Login · apS{% endblock %}
{% block head_extra %}
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
            <div class="card-body">
                <div class="text-center mb-3">
                    <img src="/static/apSLogo.png" alt="logo" width="72" height="72" style="background: white; border-radius: 50%; padding: 5px;">
                    <h5 class="mt-2">Account Login</h5>
                </div>
                <form method="POST" action="/login/">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ next|default:'/' }}" />
                    {% if error %}
                    <div class="alert alert-danger" role="alert">{{ error }}</div>
                    {% endif %}
                    <div class="mb-3">
                        <label class="form-label">Email address</label>
                        <input type="email" name="email" required class="form-control" placeholder="name@example.com" value="{{ email|default:'' }}" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="password" required class="form-control" placeholder="••••••••" />
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                        <a href="#" class="small">Forgot password?</a>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-success">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>
{% endblock %}

{% extends "base.html" %}
{% load static %}
{% block title %}Dashboard · apS Fire Alarm{% endblock %}
{% block head_extra %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; }
    /* Fixed grid below the navbar: [tab | sidebar | map] */
    .map-layout { position: fixed; top: 56px; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 36px 320px 1fr; gap: 0; }
    .map-layout.collapsed { grid-template-columns: 36px 0 1fr; }

    .drawer-tab { border-right: 1px solid #e9ecef; background: #ffffffb0; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
    .drawer-tab button { writing-mode: vertical-rl; text-orientation: mixed; transform: rotate(180deg); padding: 6px 4px; }

    .sidebar { background: rgba(255,255,255,0.97); box-shadow: 2px 0 12px rgba(0,0,0,0.08); padding: 14px 0; overflow-y: auto; }
    .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 0 18px 10px 18px; }
    .sidebar h2 { font-size: 1.1rem; margin: 0; color: #263169; font-weight: 600; }
    .device-list { list-style: none; padding: 0 12px 10px 12px; margin: 0; }
    .device-item { border-radius: 10px; margin-bottom: 12px; background: #eef1ff; box-shadow: 0 1px 4px #0001; padding: 10px 12px; border-left: 6px solid #4251c5; }
    .device-item.alert { background: #ffeaea; border-left-color: #e53935; animation: blink 1.5s linear infinite; }
    .device-item.offline { background: #fff7dd; border-left-color: #f0ad4e; }
    .device-title { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #263169; font-size: 1rem; cursor: default; }
    .device-sub { font-size: 0.92em; color: #5a5a5a; }
    .badge-role { font-size: 0.7rem; letter-spacing: .3px; }
    .toggle { cursor: pointer; user-select: none; }
    .toggle .chev { transition: transform .15s ease; display: inline-block; }
    .toggle.collapsed .chev { transform: rotate(-90deg); }

    .slave-list { list-style: none; padding-left: 0; margin: 10px 0 0 18px; border-left: 2px dashed #cbd3ff; }
    .slave-item { padding: 8px 10px; margin: 8px 0 0 0; border-radius: 8px; background: #f4f6ff; }
    .slave-item.alert { background: #ffeaea; }
    .slave-item.offline { background: #fff7dd; }

    #map { height: 100%; width: 100%; }

    @keyframes blink { 0% { opacity: 1;} 50% { opacity: 0.2;} 100% { opacity: 1;} }
    .icon-green { filter: hue-rotate(90deg);} 
    .icon-blink, .leaflet-marker-icon.icon-blink { animation: blink 1s linear infinite; }
    .icon-offline { filter: grayscale(100%) brightness(0.85); opacity: 0.8; }
    @media (max-width: 700px) { .map-layout { grid-template-columns: 36px 70vw 1fr; } .map-layout.collapsed { grid-template-columns: 36px 0 1fr; } }
    @media (max-width: 520px) { .map-layout { grid-template-columns: 0 0 1fr; } }
  </style>
{% endblock %}

{% block content %}
  <div class="map-layout" id="mapLayout">
    <div class="drawer-tab">
      <button id="sidebarToggleBtn" class="btn btn-outline-secondary btn-sm" title="Toggle devices">Devices</button>
    </div>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Devices</h2>
        <div class="d-flex align-items-center gap-2">
          <span id="deviceCounts" class="text-muted small"></span>
          <button class="btn btn-sm btn-outline-secondary" id="collapseAllBtn">Collapse all</button>
        </div>
      </div>
      <ul class="device-list" id="sidebarDeviceList"></ul>
    </div>
    <div id="map"></div>
  </div>
{% endblock %}

{% block scripts %}
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
  // Admin visibility flags for owner details
  const IS_STAFF = {{ request.user.is_staff|yesno:"true,false" }};
  const IS_SUPERUSER = {{ request.user.is_superuser|yesno:"true,false" }};
  const SHOW_OWNER = IS_STAFF || IS_SUPERUSER;
  const SMOKE_ALERT_THRESHOLD = 50;
  // Device is ONLINE if we received a message within freshness window
  // Keep aligned with backend DEVICE_ONLINE_FRESHNESS_SECONDS (default 180s)
  const ONLINE_FRESHNESS_MS = 180 * 1000;
  const DHAKA_TZ = 'Asia/Dhaka';
  // Unify time display with the MQTT-provided format: "DD Mon YYYY, hh:mm:ss am/pm" in Dhaka
  const dhaka12Fmt = new Intl.DateTimeFormat('en-GB', {
    timeZone: DHAKA_TZ,
    year: 'numeric', month: 'short', day: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true,
  });
  function toDhakaString(dateObj) {
    try { const s = dhaka12Fmt.format(dateObj); return s.replace('AM', 'am').replace('PM', 'pm'); } catch { return '—'; }
  }
  function normalizeIsoToDate(iso) {
    if (!iso) return null;
    try {
      // Handle forms like 2025-09-27T12:34:56+0600 by inserting colon in TZ if missing
      if (typeof iso === 'string' && /[+-]\d{4}$/.test(iso)) iso = iso.slice(0, -2) + ':' + iso.slice(-2);
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      return d;
    } catch { return null; }
  }
  function formatDhaka(value) {
    if (value == null) return '—';
    if (typeof value === 'number') {
      const n = Number(value);
      if (!Number.isFinite(n)) return '—';
      return toDhakaString(new Date(n * 1000));
    }
    const d = normalizeIsoToDate(value);
    return d ? toDhakaString(d) : '—';
  }

  let map = L.map('map').setView([23.777628, 90.405449], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
  let deviceMarkers = {};
  let allDevices = {};
  let expandedMasters = new Set();
  let lastSeenAt = {}; // ms timestamp when a message was received for device

    function isOnline(deviceId) {
      const seen = lastSeenAt[deviceId] || 0;
      return (Date.now() - seen) <= ONLINE_FRESHNESS_MS;
    }

    function updateNotificationBell() {
      const bell = document.getElementById('notificationBell');
      if (!bell) return;
      // Bell should ring only when smoke is above threshold
      const anyAlert = Object.keys(allDevices).some(id => {
        const dev = allDevices[id];
        const smoke = Number(dev.smoke) || 0;
        return isOnline(id) && smoke > SMOKE_ALERT_THRESHOLD;
      });
      bell.classList.toggle('active', anyAlert);
    }

    function renderSidebarDevices() {
      const sidebarList = document.getElementById('sidebarDeviceList');
      const countsLabel = document.getElementById('deviceCounts');
      sidebarList.innerHTML = '';

      const devices = Object.values(allDevices);
      const masters = devices.filter(d => (d.role || '').toLowerCase() === 'master');
      const slaves = devices.filter(d => (d.role || '').toLowerCase() === 'slave');
      const byMasterId = {};
      slaves.forEach(s => {
        const mid = s.master_id || null;
        if (!byMasterId[mid]) byMasterId[mid] = [];
        byMasterId[mid].push(s);
      });

      countsLabel.textContent = `${masters.length} masters · ${slaves.length} slaves`;

      masters.sort((a, b) => {
        const lastA = lastSeenAt[a.deviceID] || 0;
        const lastB = lastSeenAt[b.deviceID] || 0;
        if (lastB !== lastA) return lastB - lastA;
        return (a.device_name || a.deviceID).localeCompare(b.device_name || b.deviceID);
      });
      masters.forEach(m => {
        const smoke = Number(m.smoke) || 0;
        const online = isOnline(m.deviceID);
        const isAlarm = online && ((m.mesh_alert === true) || (smoke > SMOKE_ALERT_THRESHOLD));
        const tsRaw = m.received_at_iso || m.timestamp_iso;
        const ts = tsRaw ? (typeof tsRaw === 'string' && tsRaw.includes('T') ? formatDhaka(tsRaw) : tsRaw) : formatDhaka(m.timestamp);

        const li = document.createElement('li');
        li.className = 'device-item';
  if (!online) li.classList.add('offline'); else if (isAlarm) li.classList.add('alert');

        const isExpanded = expandedMasters.has(m.device_pk);
        const chevClass = isExpanded ? '' : 'collapsed';
        const rolePill = '<span class="badge rounded-pill bg-primary badge-role">MASTER</span>';

        let ownerLine = '';
        if (SHOW_OWNER && (m.owner_email || m.owner_phone)) {
          ownerLine = `<div class="device-sub text-muted small">Owner: ${m.owner_email || ''}${m.owner_phone ? ' · ' + m.owner_phone : ''}</div>`;
        }

        li.innerHTML = `
          <div class="device-title toggle ${chevClass}" data-master="${m.device_pk}">
            <span class="chev">▾</span>
            ${rolePill}
            <span>${m.deviceID}</span>
            <span class="text-muted">— ${m.device_name || ''}</span>
          </div>
          <div class="device-sub"><b>Status:</b> ${online ? 'online' : 'offline'}${(!online && m.mesh_alert) ? ' · <span class="text-danger">mesh alert</span>' : ''} · <b>Smoke:</b> ${smoke} · <b>Updated:</b> ${ts}</div>
          ${ownerLine}
          <ul class="slave-list" style="display:${isExpanded ? 'block' : 'none'}"></ul>
        `;

        const slaveUl = li.querySelector('.slave-list');
        const kids = (byMasterId[m.device_pk] || []).sort((a, b) => {
          const lastA = lastSeenAt[a.deviceID] || 0;
          const lastB = lastSeenAt[b.deviceID] || 0;
          if (lastB !== lastA) return lastB - lastA;
          return (a.device_name || a.deviceID).localeCompare(b.device_name || b.deviceID);
        });
        kids.forEach(s => {
          const sSmoke = Number(s.smoke) || 0;
          const sOnline = isOnline(s.deviceID);
          const sAlarm = sOnline && ((s.mesh_alert === true) || (sSmoke > SMOKE_ALERT_THRESHOLD));
          const sTsRaw = s.received_at_iso || s.timestamp_iso;
          const sTs = sTsRaw ? (typeof sTsRaw === 'string' && sTsRaw.includes('T') ? formatDhaka(sTsRaw) : sTsRaw) : formatDhaka(s.timestamp);
          const sli = document.createElement('li');
          sli.className = 'slave-item';
          if (!sOnline) sli.classList.add('offline'); else if (sAlarm) sli.classList.add('alert');
          const rolePillSlave = '<span class="badge rounded-pill bg-secondary badge-role">SLAVE</span>';
          const masterName = m.device_name || m.deviceID;
          let sOwnerLine = '';
          if (SHOW_OWNER && (s.owner_email || s.owner_phone)) {
            sOwnerLine = `<div class=\"text-muted small\">Owner: ${s.owner_email || ''}${s.owner_phone ? ' · ' + s.owner_phone : ''}</div>`;
          }
          sli.innerHTML = `
            <div class="d-flex align-items-center gap-2"><span>${rolePillSlave}</span><span><b>${s.deviceID}</b> — ${s.device_name || ''}</span></div>
            <div class="device-sub"><b>Master:</b> ${masterName} · <b>Status:</b> ${sOnline ? 'online' : 'offline'}${(!sOnline && s.mesh_alert) ? ' · <span class=\"text-danger\">mesh alert</span>' : ''} · <b>Smoke:</b> ${sSmoke} · <b>Updated:</b> ${sTs}</div>
            ${sOwnerLine}
          `;
          slaveUl.appendChild(sli);
        });

        sidebarList.appendChild(li);
      });

      // Toggle handling
      sidebarList.querySelectorAll('.toggle').forEach(el => {
        el.addEventListener('click', () => {
          const mid = Number(el.getAttribute('data-master'));
          if (expandedMasters.has(mid)) expandedMasters.delete(mid); else expandedMasters.add(mid);
          renderSidebarDevices();
        });
      });
    }

    function getIcon(kind = 'normal', blink = false) {
      // kind: 'normal' (green), 'alarm' (red), 'offline' (grey)
      let iconUrl = '/static/smoke-detector.png';
      let className = '';
      if (kind === 'normal') className = 'icon-green';
      if (kind === 'offline') className = 'icon-offline';
      if (kind === 'alarm') iconUrl = '/static/fire-alert.png';
      if (blink && kind === 'alarm') className += ' icon-blink';
      return L.icon({ iconUrl, iconSize: [38, 38], className: className.trim() });
    }

  // Resilient WebSocket with heartbeat + reconnect (handles prod proxy/LB idle timeouts)
  const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
  let ws = null;
  let wsPingTimer = null;
  let wsReconnectTimer = null;
  let wsReconnectAttempt = 0;

  function scheduleReconnect() {
    if (wsReconnectTimer) return; // already scheduled
    const base = 1000; // 1s
    const max = 30000; // 30s
    const delay = Math.min(max, base * Math.pow(2, wsReconnectAttempt)) + Math.floor(Math.random() * 500);
    wsReconnectAttempt += 1;
    wsReconnectTimer = setTimeout(() => {
      wsReconnectTimer = null;
      connectWS();
    }, delay);
  }

  function clearPing() {
    if (wsPingTimer) { clearInterval(wsPingTimer); wsPingTimer = null; }
  }

  function connectWS() {
    try { if (ws && ws.readyState === WebSocket.OPEN) return; } catch {}
    try { if (ws) { try { ws.close(); } catch {} } } catch {}
    ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);

    ws.onopen = function () {
      wsReconnectAttempt = 0;
      clearPing();
      // Heartbeat every 25s keeps intermediaries from timing out idle WS
      wsPingTimer = setInterval(() => {
        try { if (ws && ws.readyState === WebSocket.OPEN) { ws.send('{"type":"ping"}'); } } catch {}
      }, 25000);
      // On (re)connect, refresh snapshot to cover any missed broadcasts during downtime
      fetchAndSeedDevices();
    };

    ws.onmessage = function (event) {
      let data = {};
      try { data = JSON.parse(event.data); } catch { return; }
      // Ignore heartbeat echos if any
      if (data && data.type === 'pong') return;
      if (data && data.type === 'ping') {
        try {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send('{"type":"pong"}');
          }
        } catch {}
        return;
      }
      if (data && data.type === 'device_removed') {
        const removedId = String(data.deviceID || '').trim();
        if (!removedId) return;
        delete allDevices[removedId];
        delete lastSeenAt[removedId];
        const marker = deviceMarkers[removedId];
        if (marker) {
          try { map.removeLayer(marker); } catch {}
        }
        delete deviceMarkers[removedId];
        renderSidebarDevices();
        updateNotificationBell();
        return;
      }
      const id = data.deviceID;
      if (!id) return;
      // Preserve known metadata (role/master/owner) while updating live fields
      allDevices[id] = { ...(allDevices[id] || {}), ...data };
      // Only treat this as fresh telemetry if we actually have a direct reading.
      // Criteria: payload includes either (smoke, status, timestamp/timestamp_iso/received_at_iso) OR explicit 'online' true AND a smoke field.
      const hasTelemetryFields = (
        Object.prototype.hasOwnProperty.call(data, 'smoke') ||
        Object.prototype.hasOwnProperty.call(data, 'status') ||
        Object.prototype.hasOwnProperty.call(data, 'timestamp') ||
        Object.prototype.hasOwnProperty.call(data, 'timestamp_iso') ||
        Object.prototype.hasOwnProperty.call(data, 'received_at_iso')
      );
      if (hasTelemetryFields) {
        lastSeenAt[id] = Date.now();
      }

      const smoke = Number(data.smoke) || 0;
      const online = isOnline(id);
      const isAlarm = online && ((data.mesh_alert === true) || (smoke > SMOKE_ALERT_THRESHOLD));
      const icon = getIcon(isAlarm ? 'alarm' : (online ? 'normal' : 'offline'), isAlarm);

      const hasLatLon = data.latitude !== undefined && data.longitude !== undefined;
      if (hasLatLon) {
        const lat = parseFloat(data.latitude); const lon = parseFloat(data.longitude);
        if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
          let marker = deviceMarkers[id];
          if (!marker) { marker = L.marker([lat, lon], { icon }).addTo(map); marker.bindPopup(''); deviceMarkers[id] = marker; }
          marker.setLatLng([lat, lon]); marker.setIcon(icon);
          const info = `
            <b>Device ID:</b> ${data.deviceID}<br>
            <b>Smoke:</b> ${smoke}<br>
            <b>Status:</b> ${online ? 'online' : `<b>offline</b>`}<br>
            <b>Updated:</b> ${data.received_at_iso || data.timestamp_iso || formatDhaka(data.timestamp)}
          `;
          marker.getPopup().setContent(info);
        }
      }
      renderSidebarDevices();
      updateNotificationBell();
    };

    ws.onclose = function () {
      clearPing();
      scheduleReconnect();
    };

    ws.onerror = function () {
      try { ws && ws.close(); } catch {}
      // onclose will handle reconnect
    };
  }

  // Start the WS connection
  connectWS();

    function ensureMarkerFor(id) {
      const d = allDevices[id];
      if (!d) return;
      const hasLatLon = d.latitude !== undefined && d.longitude !== undefined;
      if (!hasLatLon) return;
      const lat = parseFloat(d.latitude);
      const lon = parseFloat(d.longitude);
      if (Number.isNaN(lat) || Number.isNaN(lon)) return;
  const smoke = Number(d.smoke) || 0;
  const online = isOnline(id);
  const isAlarm = online && ((d.mesh_alert === true) || (smoke > SMOKE_ALERT_THRESHOLD));
  const icon = getIcon(isAlarm ? 'alarm' : (online ? 'normal' : 'offline'), isAlarm);
      let marker = deviceMarkers[id];
      if (!marker) {
        marker = L.marker([lat, lon], { icon }).addTo(map);
        marker.bindPopup('');
        deviceMarkers[id] = marker;
      }
      marker.setLatLng([lat, lon]);
      marker.setIcon(icon);
      const tsRaw = d.received_at_iso || d.timestamp_iso;
      const ts = tsRaw ? (typeof tsRaw === 'string' && tsRaw.includes('T') ? formatDhaka(tsRaw) : tsRaw) : formatDhaka(d.timestamp);
      const info = `
        <b>Device ID:</b> ${d.deviceID}<br>
        <b>Smoke:</b> ${smoke}<br>
        <b>Status:</b> ${online ? 'online' : `<b>offline</b>`}<br>
        <b>Updated:</b> ${ts}
      `;
      marker.getPopup().setContent(info);
    }

    async function fetchAndSeedDevices() {
      try {
        let url = '/devices/';
        const items = [];
        for (let i = 0; i < 10; i++) {
          const data = await apiGet(url);
          if (Array.isArray(data)) {
            items.push(...data);
            break;
          }
          const pageItems = Array.isArray(data.results) ? data.results : [];
          items.push(...pageItems);
          if (!data.next) break;
          url = data.next;
        }
        // Seed allDevices and lastSeenAt; default to offline until proven otherwise
        items.forEach(dev => {
          const id = String(dev.hardware_identifier || '').trim();
          if (!id) return;
          const ts = dev.last_seen ? new Date(dev.last_seen).getTime() : 0;
          lastSeenAt[id] = ts || 0;
          allDevices[id] = {
            deviceID: id,
            device_pk: dev.id,
            smoke: 0,
            status: dev.status || '',
            timestamp: ts ? Math.floor(ts / 1000) : null,
            // Store as raw string; we will format at render time to keep consistency
            timestamp_iso: dev.last_seen || null,
            received_at_iso: dev.last_seen || null,
            latitude: dev.latitude,
            longitude: dev.longitude,
            role: dev.device_role || '',
            master_id: dev.master_id || null,
            master_name: dev.master_device_name || '',
            master_hid: dev.master_hardware_identifier || '',
            device_name: dev.name || dev.device_name || '',
            owner_email: dev.owner_email || '',
            owner_phone: dev.owner_phone || '',
            mesh_alert: !!dev.mesh_alert,
          };
          ensureMarkerFor(id);
        });
        renderSidebarDevices();
        updateNotificationBell();
      } catch (e) {
        console.error('Failed to fetch devices for initial state', e);
      }
    }

    // Sidebar collapse controls
    const sidebarEl = document.getElementById('sidebar');
    const mapLayoutEl = document.getElementById('mapLayout');
    const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
    const collapseAllBtn = document.getElementById('collapseAllBtn');
    sidebarToggleBtn.addEventListener('click', () => {
      mapLayoutEl.classList.toggle('collapsed');
      setTimeout(() => { map.invalidateSize(); }, 220);
    });
    collapseAllBtn.addEventListener('click', () => { expandedMasters.clear(); renderSidebarDevices(); });

    // Seed from API on load; devices start offline unless recent last_seen proves otherwise
    fetchAndSeedDevices();

    // Periodic passive refresh (every 30s) to downgrade stale devices without traffic
    setInterval(() => {
      const now = Date.now();
      Object.keys(allDevices).forEach(id => {
        const dev = allDevices[id];
        // Do not modify lastSeenAt here; only real telemetry bumps it.
        // Marker/icon refresh reflects current computed online state.
        ensureMarkerFor(id);
      });
      renderSidebarDevices();
      updateNotificationBell();
    }, 30000);
  </script>
{% endblock %}

{% extends "base.html" %}
{% load static %}
{% block title %}Dashboard · apS Fire Alarm{% endblock %}
{% block head_extra %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
    .sidebar { position: fixed; top: 56px; left: 0; width: 290px; bottom: 0; background: rgba(255,255,255,0.95); box-shadow: 2px 0 8px rgba(0,0,0,0.06); padding: 18px 0; z-index: 900; overflow-y: auto; transition: transform 0.2s; }
    .sidebar h2 { font-size: 1.2rem; margin: 0 24px 18px 24px; color: #263169; font-weight: 600; }
    .device-list { list-style: none; padding: 0 10px; margin: 0; }
    .device-list li { border-radius: 8px; margin-bottom: 14px; background: #e3e8ff; box-shadow: 0 1px 4px #0001; display: flex; flex-direction: column; padding: 12px 15px 10px 15px; transition: background 0.16s; border-left: 6px solid #4251c5; position: relative; }
    .device-list li.alert { background: #ffeaea; border-left: 6px solid #e53935; animation: blink 1.5s linear infinite; }
    .device-list li .device-id { font-weight: 600; color: #263169; margin-bottom: 3px; font-size: 1.06rem; }
    .device-list li .device-status { display: inline-block; font-size: 0.9em; font-weight: bold; padding: 2px 12px; border-radius: 5px; }
    .device-list li .device-status.normal { background: #c8e6c9; color: #256029; }
    .device-list li .device-status.alert { background: #ffcdd2; color: #b71c1c; }
    .device-list li .device-detail { font-size: 0.97em; color: #555; margin-top: 3px; line-height: 1.3; }
    #map { position: absolute; top: 56px; left: 290px; right: 0; bottom: 0; z-index: 1; }
    @keyframes blink { 0% { opacity: 1;} 50% { opacity: 0.2;} 100% { opacity: 1;} }
    .icon-green { filter: hue-rotate(90deg);}
    .icon-blink, .leaflet-marker-icon.icon-blink { animation: blink 1s linear infinite; }
    @media (max-width: 700px) { .sidebar { width: 70vw; } #map { left: 70vw; } }
    @media (max-width: 520px) { .sidebar { display: none; } #map { left: 0; } }
  </style>
{% endblock %}

{% block content %}
  <div class="sidebar">
    <h2>Devices</h2>
    <ul class="device-list" id="sidebarDeviceList"></ul>
  </div>
  <div id="map"></div>
{% endblock %}

{% block scripts %}
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
  const SMOKE_ALERT_THRESHOLD = 50;
    const DHAKA_TZ = 'Asia/Dhaka';
    const dhakaFormatter = new Intl.DateTimeFormat(undefined, { timeZone: DHAKA_TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
    function formatDhakaTS(epochSeconds) { if (!epochSeconds && epochSeconds !== 0) return '—'; const n = Number(epochSeconds); if (!Number.isFinite(n)) return '—'; const d = new Date(n * 1000); return dhakaFormatter.format(d); }

    let map = L.map('map').setView([23.777628, 90.405449], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors' }).addTo(map);
    let deviceMarkers = {};
    let allDevices = {};

    function updateNotificationBell() {
      const bell = document.getElementById('notificationBell');
      if (!bell) return;
      const anyAlert = Object.values(allDevices).some(dev => {
        const smoke = Number(dev.smoke) || 0;
        const statusLower = String(dev.status || '').toLowerCase();
        return smoke > SMOKE_ALERT_THRESHOLD || ['alert','fire','alarm'].includes(statusLower) || statusLower !== 'alive';
      });
      bell.classList.toggle('active', anyAlert);
    }

    function renderSidebarDevices() {
      const sidebarList = document.getElementById('sidebarDeviceList');
      sidebarList.innerHTML = '';
      const devices = Object.values(allDevices).sort((a, b) => a.deviceID.localeCompare(b.deviceID));
      devices.forEach(d => {
        const smoke = Number(d.smoke) || 0;
        const statusLower = String(d.status || '').toLowerCase();
        const isAlive = statusLower === 'alive';
        const isAlert = smoke > SMOKE_ALERT_THRESHOLD || ['alert','fire','alarm'].includes(statusLower) || !isAlive;
        const ts = d.received_at_iso || d.timestamp_iso || formatDhakaTS(d.timestamp);
        const li = document.createElement('li');
        if (isAlert) li.classList.add('alert');
        li.innerHTML = `
          <div class="device-id">${d.deviceID}</div>
          <div class="device-detail">
            <span><b>Smoke:</b> ${smoke}</span><br>
            <span><b>Status:</b> ${isAlive ? 'alive' : (statusLower || 'not-alive')}</span><br>
            <span><b>Updated:</b> ${ts}</span>
          </div>
          <span class="device-status ${isAlert ? 'alert' : 'normal'}">${isAlert ? 'ALERT' : 'Normal'}</span>
        `;
        sidebarList.appendChild(li);
      });
    }

    function getIcon(color = 'green', blink = false) {
      let iconUrl = color === 'green' ? '/static/smoke-detector.png' : '/static/fire-alert.png';
      let className = color === 'green' ? 'icon-green' : '';
      if (blink) className += ' icon-blink';
      return L.icon({ iconUrl, iconSize: [38, 38], className: className.trim() });
    }

    const wsProtocol = location.protocol === 'https:' ? 'wss' : 'ws';
    let ws = new WebSocket(`${wsProtocol}://${location.host}/ws`);
    ws.onmessage = function (event) {
      let data = JSON.parse(event.data);
      let id = data.deviceID;
      allDevices[id] = data;
      const smoke = Number(data.smoke) || 0;
      const statusLower = String(data.status || '').toLowerCase();
      const isAlive = statusLower === 'alive';
      let alert = smoke > SMOKE_ALERT_THRESHOLD || ['alert','fire','alarm'].includes(statusLower) || !isAlive;
      let icon = getIcon(alert ? 'red' : 'green', alert);

      let hasLatLon = data.latitude !== undefined && data.longitude !== undefined;
      if (hasLatLon) {
        let lat = parseFloat(data.latitude); let lon = parseFloat(data.longitude);
        if (!Number.isNaN(lat) && !Number.isNaN(lon)) {
          let marker = deviceMarkers[id];
          if (!marker) { marker = L.marker([lat, lon], { icon }).addTo(map); marker.bindPopup(''); deviceMarkers[id] = marker; }
          marker.setLatLng([lat, lon]); marker.setIcon(icon);
          let info = `
            <b>Device ID:</b> ${data.deviceID}<br>
            <b>Smoke:</b> ${smoke}<br>
            <b>Status:</b> ${isAlive ? 'alive' : `<b>${statusLower || 'NOT ALIVE'}</b>`}<br>
            <b>Updated:</b> ${data.received_at_iso || data.timestamp_iso || formatDhakaTS(data.timestamp)}
          `;
          marker.getPopup().setContent(info);
        }
      }
      renderSidebarDevices();
      updateNotificationBell();
    };
  </script>
{% endblock %}

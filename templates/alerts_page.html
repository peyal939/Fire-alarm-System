{% extends "base.html" %}
{% block title %}Alerts · apS Fire Alarm{% endblock %}
{% block content %}
<div class="py-3">
  <div class="d-flex align-items-center justify-content-between mb-2">
    <h1 class="h4 mb-0">Alerts</h1>
    <div class="d-flex gap-2 align-items-center flex-wrap">
      <select id="statusFilter" class="form-select" style="max-width: 180px;">
        <option value="">All status</option>
        <option value="open">Open only</option>
        <option value="resolved">Resolved only</option>
      </select>
      <select id="deviceFilter" class="form-select" style="min-width: 220px;">
        <option value="">All devices</option>
      </select>
      <button id="refreshAlertsBtn" class="btn btn-outline-secondary">Refresh</button>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-striped align-middle" id="alertsTable">
      <thead>
        <tr>
          <th>Device</th>
          <th>Alert</th>
          <th>Status</th>
          <th>Triggered</th>
          <th>Resolved</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <div id="alertsEmpty" class="text-muted" style="display:none">No alerts found.</div>
</div>
{% endblock %}

{% block scripts %}
  <script>
    const tbody = document.querySelector('#alertsTable tbody');
    const empty = document.getElementById('alertsEmpty');
    const statusFilter = document.getElementById('statusFilter');
    const deviceFilter = document.getElementById('deviceFilter');
    const refreshBtn = document.getElementById('refreshAlertsBtn');

    const deviceIndex = new Map();
    const ALERT_LABELS = {
      smoke_high: 'High smoke detected',
    };

    const STATUS_LABELS = {
      open: { text: 'Open', badge: 'bg-danger' },
      resolved: { text: 'Resolved', badge: 'bg-success' },
    };

    function formatDate(value) {
      if (!value) return '—';
      try {
        return new Date(value).toLocaleString();
      } catch (err) {
        return value;
      }
    }

    function deviceLabel(alert) {
      const info = deviceIndex.get(String(alert.device));
      if (info) {
        const name = info.device_name ? ` — ${info.device_name}` : '';
        return `<strong>${info.hardware_identifier}</strong>${name}`;
      }
      if (alert.device_hardware_identifier) {
        return `<strong>${alert.device_hardware_identifier}</strong>`;
      }
      return 'Unknown device';
    }

    async function loadDevices() {
      try {
        let url = '/devices/';
        const items = [];
        for (let i = 0; i < 10; i++) {
          const data = await apiGet(url);
          if (Array.isArray(data)) {
            items.push(...data);
            break;
          }
          if (Array.isArray(data.results)) {
            items.push(...data.results);
          }
          if (!data.next) break;
          url = data.next;
        }
        deviceIndex.clear();
        items.forEach((device) => {
          deviceIndex.set(String(device.id), device);
        });
        deviceFilter.innerHTML = '<option value="">All devices</option>' + items
          .map((device) => {
            const name = device.device_name ? ` — ${device.device_name}` : '';
            return `<option value="${device.id}">${device.hardware_identifier}${name}</option>`;
          })
          .join('');
      } catch (err) {
        console.error('Failed to load device list', err);
        deviceFilter.innerHTML = '<option value="">All devices</option>'; // keep default
      }
    }

    async function fetchAlerts() {
      let url = '/alerts/';
      const params = [];
      if (statusFilter.value) params.push(`status=${encodeURIComponent(statusFilter.value)}`);
      const dev = (deviceFilter.value || '').trim();
      if (dev) params.push(`device=${encodeURIComponent(dev)}`);
      if (params.length) url += `?${params.join('&')}`;

      let items = [];
      for (let i = 0; i < 10; i++) {
        const data = await apiGet(url);
        if (Array.isArray(data)) { items = data; break; }
        items = items.concat(Array.isArray(data.results) ? data.results : []);
        if (!data.next) break;
        url = data.next;
      }
      renderAlerts(items);
    }

    function renderAlerts(items) {
      tbody.innerHTML = '';
      items.forEach((alert) => {
        const tr = document.createElement('tr');
        const statusInfo = STATUS_LABELS[alert.status] || { text: alert.status || 'Unknown', badge: 'bg-secondary' };
        const alertLabel = ALERT_LABELS[alert.alert_type] || (alert.alert_type ? alert.alert_type.replace(/_/g, ' ') : 'Alert');
        tr.innerHTML = `
          <td>${deviceLabel(alert)}</td>
          <td>${alertLabel}</td>
          <td><span class="badge ${statusInfo.badge}">${statusInfo.text}</span></td>
          <td>${formatDate(alert.triggered_at)}</td>
          <td>${formatDate(alert.resolved_at)}</td>
          <td>
            ${alert.status === 'open' ? `<button class="btn btn-sm btn-outline-success" data-action="resolve" data-id="${alert.id}">Resolve</button>` : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
      empty.style.display = items.length ? 'none' : '';
    }

    tbody.addEventListener('click', async (e) => {
      const btn = e.target.closest('button[data-action="resolve"]');
      if (!btn) return;
      const id = btn.getAttribute('data-id');
      try {
        btn.disabled = true;
        await apiPost(`/alerts/${id}/resolve/`, {});
        await fetchAlerts();
      } catch(err) {
        console.error(err);
        alert('Failed to resolve alert.');
      } finally {
        btn.disabled = false;
      }
    });

    statusFilter.addEventListener('change', fetchAlerts);
    deviceFilter.addEventListener('change', fetchAlerts);
    refreshBtn.addEventListener('click', fetchAlerts);

    loadDevices().finally(fetchAlerts);
  </script>
{% endblock %}

# Nginx configuration for apS Fire Alarm Backend
# File location: /etc/nginx/sites-available/firealarm.pranisheba.com.bd
#
# After creating this file:
# sudo ln -s /etc/nginx/sites-available/firealarm.pranisheba.com.bd /etc/nginx/sites-enabled/
# sudo nginx -t
# sudo systemctl reload nginx

# Upstream to Daphne ASGI server
upstream daphne_server {
    server localhost:6066;  # Your docker-compose maps 6066:8000
    # For multiple workers, add more servers:
    # server localhost:6067;
    # server localhost:6068;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name firealarm.pranisheba.com.bd www.firealarm.pranisheba.com.bd;
    
    # Redirect all HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name firealarm.pranisheba.com.bd www.firealarm.pranisheba.com.bd;
    
    # SSL certificates (configure your cert paths - update these!)
    # If using Certbot: sudo certbot --nginx -d firealarm.pranisheba.com.bd
    ssl_certificate /etc/letsencrypt/live/firealarm.pranisheba.com.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/firealarm.pranisheba.com.bd/privkey.pem;
    
    # SSL configuration (Mozilla Intermediate)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Max upload size
    client_max_body_size 100M;
    
    # Logs
    access_log /var/log/nginx/firealarm_access.log;
    error_log /var/log/nginx/firealarm_error.log;
    
    # Root directory (for potential future use)
    root /var/www/html;
    
    # ========================================
    # CRITICAL FIX #1: Serve static files directly
    # ========================================
    location /static/ {
        # IMPORTANT: Update this path to your actual staticfiles location
        # Option 1: Point to staticfiles in your project
        alias /path/to/pranisheba-fire-alarm-app-backend/staticfiles/;
        
        # Option 2: Or copy staticfiles to a dedicated location
        # alias /var/www/firealarm-static/;
        
        # Performance optimizations
        expires 30d;
        add_header Cache-Control "public, immutable";
        
        # Enable gzip compression
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;
        
        # CORS if needed for assets
        add_header Access-Control-Allow-Origin * always;
        
        # Security: Don't allow directory listing
        autoindex off;
        
        # Serve pre-compressed files if available
        gzip_static on;
    }
    
    # ========================================
    # CRITICAL FIX #2: WebSocket endpoint with upgrade headers
    # ========================================
    location /ws {
        proxy_pass http://daphne_server;
        
        # WebSocket upgrade headers (CRITICAL!)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts for long-lived connections
        proxy_read_timeout 86400s;  # 24 hours
        proxy_send_timeout 86400s;  # 24 hours
        proxy_connect_timeout 75s;
        
        # Disable buffering for WebSocket
        proxy_buffering off;
        
        # Don't redirect on error
        proxy_intercept_errors off;
    }
    
    # ========================================
    # Health check endpoint (optional - bypass proxy for faster checks)
    # ========================================
    location = /api/healthz {
        proxy_pass http://daphne_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No caching for health checks
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        
        # Quick timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
    
    location = /api/readyz {
        proxy_pass http://daphne_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # No caching for health checks
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        
        # Quick timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }
    
    # ========================================
    # All other requests → Django/Daphne
    # ========================================
    location / {
        proxy_pass http://daphne_server;
        
        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        
        # Timeouts
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
        proxy_busy_buffers_size 8k;
    }
    
    # ========================================
    # Optional: Deny access to sensitive files
    # ========================================
    location ~ /\.env {
        deny all;
        return 404;
    }
    
    location ~ /\.git {
        deny all;
        return 404;
    }
    
    location ~ /\.ht {
        deny all;
        return 404;
    }
}
